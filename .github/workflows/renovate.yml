name: Renovate

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.6
        with:
          configurationFile: .github/renovate-config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
          additional-env-list: |
            LIGHTWELL_USERNAME
            LIGHTWELL_TOKEN
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
