---
version: 2
registries:
  lightwell-maven:
    type: maven-repository
    url: https://packages.redhat.com/lightwell/java/remediated/
    username: ${{secrets.LIGHTWELL_USERNAME}}
    password: ${{secrets.LIGHTWELL_TOKEN}}

updates:
  - package-ecosystem: maven
    directory: "/java"
    open-pull-requests-limit: 0
    registries:
      - lightwell-maven
    schedule:
      interval: "weekly"
